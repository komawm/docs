name: Publish manuals to R2 CDN

# Automatically builds deterministic tri-lingual manual bundles (`koma` and `jiku`)
# whenever `manual/**` changes on `main`, uploads them to Cloudflare R2
# (`https://cdn.komawm.org/manual/{koma,jiku}/`), and sends a `repository_dispatch`
# (`manual-published`) to `komawm/website` so Astro statically pre-renders the
# updated pages without requiring any Git commits in `komawm/website`.

on:
  push:
    branches:
      - main
    paths:
      - "manual/**"
      - "scripts/build-manuals.py"
      - ".github/workflows/cd-manual.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Manual surface to publish
        type: choice
        options:
          - all
          - koma
          - jiku
        required: true
        default: all
      dispatch_website:
        description: Trigger komawm/website static rebuild after R2 upload
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: cd-manual-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify parity and bundle manual archives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SURFACE: ${{ inputs.target || 'all' }}
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build deterministic manual archives and manifests
        env:
          OUT_DIR: ${{ runner.temp }}/manual-dist
        run: |
          set -euo pipefail
          python3 scripts/check.py
          python3 scripts/check-links.py
          python3 scripts/build-manuals.py \
            --surface "$TARGET_SURFACE" \
            --revision "$GITHUB_SHA" \
            --out "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum --check --strict SHA256SUMS)

      - name: Upload bundled manual artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-bundles
          path: ${{ runner.temp }}/manual-dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to cdn.komawm.org and dispatch website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: manual-cd
    permissions:
      contents: read
    env:
      R2_BUCKET: komawm
      DISPATCH_WEBSITE: ${{ inputs.dispatch_website != false }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Set up Bun for Wrangler R2 upload
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Download bundled manual artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manual-bundles
          path: manual-dist

      - name: Verify bundle digests and upload to Cloudflare R2
        id: r2_upload
        working-directory: manual-dist
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be configured in the 'manual-cd' environment"
              exit 1
            fi
            echo "::notice::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not set; skipping R2 upload and website dispatch on push."
            echo "r2_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wrangler_dir="${{ runner.temp }}/wrangler-cli"
          mkdir -p "$wrangler_dir"
          (cd "$wrangler_dir" && bun add --no-save wrangler@4.136.0)
          wrangler_bin="${wrangler_dir}/node_modules/.bin/wrangler"
          r2_put() {
            local key="$1" file="$2" ctype="$3" cache="$4"
            WRANGLER_SEND_METRICS=false "$wrangler_bin" r2 object put "${R2_BUCKET}/${key}" \
              --file "$file" \
              --content-type "$ctype" \
              --cache-control "$cache" \
              --remote
          }

          # Upload immutable versioned objects first, then flip mutable latest.json pointers last.
          for surface_dir in koma jiku; do
            [[ -d "$surface_dir" ]] || continue
            rev_dir="$(jq -r '.version_dir' "$surface_dir/latest.json")"
            r2_put "manual/${surface_dir}/${rev_dir}/manifest.json" \
              "$surface_dir/${rev_dir}/manifest.json" \
              "application/json; charset=utf-8" \
              "public, max-age=31536000, immutable"
            for loc in en zh-CN ja; do
              r2_put "manual/${surface_dir}/${rev_dir}/${loc}.tar.gz" \
                "$surface_dir/${rev_dir}/${loc}.tar.gz" \
                "application/gzip" \
                "public, max-age=31536000, immutable"
              while IFS= read -r -d '' page_json; do
                rel_json="${page_json#./}"
                r2_put "manual/${rel_json}" \
                  "$rel_json" \
                  "application/json; charset=utf-8" \
                  "public, max-age=300"
              done < <(find "${surface_dir}/${loc}" -type f -name '*.json' -print0 | LC_ALL=C sort -z)
            done
            r2_put "manual/${surface_dir}/latest.json" \
              "$surface_dir/latest.json" \
              "application/json; charset=utf-8" \
              "public, max-age=300"
          done

      - name: Trigger komawm/website static rebuild via repository_dispatch
        if: ${{ env.DISPATCH_WEBSITE == 'true' && steps.r2_upload.outputs.r2_skipped != 'true' }}
        working-directory: manual-dist
        run: |
          set -euo pipefail
          if [[ -z "${WEBSITE_DISPATCH_TOKEN:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "::error::WEBSITE_DISPATCH_TOKEN must be configured in the 'manual-cd' environment when dispatch_website is enabled"
              exit 1
            fi
            echo "::notice::WEBSITE_DISPATCH_TOKEN is not set; skipping automatic repository_dispatch to komawm/website."
            exit 0
          fi
          payload="$(jq -c '{event_type: "manual-published", client_payload: .}' dispatch-payload.json)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEBSITE_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/komawm/website/dispatches" \
            -d "$payload"
          echo "Dispatched manual-published to komawm/website"
