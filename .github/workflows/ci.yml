name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Canonical specs, manual i18n parity and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate canonical repository metadata and specs
        run: python3 scripts/check.py

      - name: Validate Markdown links
        run: python3 scripts/check-links.py

      - name: Validate Koma and Jiku manual locale parity (en, zh-CN & ja)
        run: python3 scripts/build-manuals.py --check

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
